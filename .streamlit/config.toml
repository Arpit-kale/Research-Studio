[theme]
base = "dark"
primaryColor = "#37C9A5"
backgroundColor = "#0B1017"
secondaryBackgroundColor = "#131C27"
textColor = "#E7EDF5"
linkColor = "#55D6B4"
borderColor = "#283646"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "large"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
headingFontSizes = ["32px", "25px", "20px", "17px", "15px", "13px"]
headingFontWeights = [650, 600, 600, 550, 500, 500]
chartCategoricalColors = ["#37C9A5", "#8AA9FF", "#FFBD69", "#D78AFF", "#FF7D89"]

[theme.sidebar]
backgroundColor = "#101823"
secondaryBackgroundColor = "#182432"
borderColor = "#283646"
